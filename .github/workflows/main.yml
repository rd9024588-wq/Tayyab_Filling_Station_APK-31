
name: Tayyab Filling Station APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: tayyab-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate app project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f package.json ]; then
            APP_DIR="."
          elif [ -f Tayyab_Filling_Station_APK_Cloud_Build/package.json ]; then
            APP_DIR="Tayyab_Filling_Station_APK_Cloud_Build"
          else
            echo "::error::package.json not found in repository root or expected app folder."
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $APP_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web application
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No web build script found; checking existing assets."
          fi

      - name: Verify Capacitor configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration file not found."
            exit 1
          fi

          if [ -f www/index.html ]; then
            echo "Web assets found in www/"
          elif [ -f dist/index.html ]; then
            echo "Web assets found in dist/"
          elif [ -f index.html ]; then
            echo "Root index.html found"
          else
            echo "::error::index.html not found in www/, dist/, or project root."
            exit 1
          fi

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and prepare APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK output file was not generated."
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Tayyab-Filling-Station-debug.apk

          echo "APK generated successfully."
          sha256sum release/Tayyab-Filling-Station-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Filling-Station-APK
          path: ${{ steps.project.outputs.dir }}/release/Tayyab-Filling-Station-debug.apk
          if-no-files-found: error
          retention-days: 14
